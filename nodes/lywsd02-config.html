<script type="text/javascript">
    (function () {
        'use strict';
        RED.nodes.registerType('lywsd02-config', {
            category: 'config',
            defaults: {
                name: { value: "" },
                mac: { value: "", required: true },
                connectTimeout: { value: 10 },
                notifyTimeout: { value: 15 },
                python: { value: "python3" }
            },
            label: function () {
                return this.name || "LYWSD02 config";
            },
            icon: "font-awesome/fa-bluetooth"
        });
    }());
</script>

<script type="text/html" data-template-name="lywsd02-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="e.g. Living Room">
    </div>
    <div class="form-row">
        <label for="node-config-input-mac"><i class="fa fa-bluetooth"></i> MAC Address</label>
        <input type="text" id="node-config-input-mac" placeholder="E7:2E:00:31:10:B6">
    </div>
    <div class="form-row">
        <label for="node-config-input-connectTimeout"><i class="fa fa-clock-o"></i> Connect Timeout (s)</label>
        <input type="number" id="node-config-input-connectTimeout" min="1" max="60" step="1">
    </div>
    <div class="form-row">
        <label for="node-config-input-notifyTimeout"><i class="fa fa-hourglass"></i> Notify Timeout (s)</label>
        <input type="number" id="node-config-input-notifyTimeout" min="1" max="60" step="1">
    </div>
    <div class="form-row">
        <label for="node-config-input-python"><i class="fa fa-terminal"></i> Python Path</label>
        <input type="text" id="node-config-input-python" placeholder="python3 or /path/to/venv/bin/python">
    </div>
</script>

<script type="text/html" data-help-name="lywsd02-config">
    <p>Configuration for a Xiaomi LYWSD02MMC temperature/humidity sensor.</p>
    <h3>Details</h3>
    <p>
        Set the device MAC address, the connection and notification timeouts,
        and the path to a Python 3 interpreter that has the <code>bleak</code>
        package installed.
    </p>
</script>
